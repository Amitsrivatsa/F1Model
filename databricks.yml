# This is a Declarative Automation Bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: 24a51af1-feee-470e-bccd-fd3b9a92ea0f

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ff2267f3-98c6.cloud.databricks.com
      profile: AS
      root_path: /Workspace/Users/${workspace.current_user.userName}/F1_workspace/${bundle.name}/${bundle.target}
    variables:
      catalog: f1_raw_metrics
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-ff2267f3-98c6.cloud.databricks.com
      profile: AS
      # We explicitly deploy to /Workspace/Users/srivatsaamit3@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/srivatsaamit3@gmail.com/F1_workspace/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: srivatsaamit3@gmail.com
        level: CAN_MANAGE
